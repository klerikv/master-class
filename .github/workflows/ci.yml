name: CI/CD Pipeline

permissions:
  issues: write
  contents: read

on:
  push:
    branches: [ develop, uat, main ]
  pull_request:
    branches: [ develop, uat, main ]

jobs:
  # Тесты
  checks:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      # Тесты
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, ctype, fileinfo, json, mbstring, pdo, pdo_sqlite, tokenizer, xml
          coverage: xdebug
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Prepare environment
        run: |
          cp .env.ci .env
          php artisan key:generate
      
      - name: Run migrations
        run: php artisan migrate --force
      
      - name: Run tests with coverage
        run: php artisan test --coverage --min=50
      
      # Статический анализ
      - name: Run Larastan
        run: vendor/bin/phpstan analyse app --level=5 --error-format=github
      
      # Линтинг
      - name: Check code style
        run: vendor/bin/pint --test

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [checks]
    if: needs.checks.result == 'success'
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
  
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
        
      - name: Setup environment
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            cp .env.prod .env
            echo "Deploying to PRODUCTION with .env.prod"
          elif [ "${{ github.ref_name }}" = "uat" ]; then
            cp .env.uat .env
            echo "Deploying to UAT with .env.uat"
          else
            cp .env.dev .env
            echo "Deploying to DEVELOPMENT with .env.dev"
          fi
          php artisan key:generate
      
      - name: Simulate deployment
        run: echo "Deployment simulation completed for ${{ github.ref_name }}"

    notify:
      name: Commit Comment
      runs-on: ubuntu-latest
      needs: [deploy]
      if: always()
      
      steps:
        - name: Add commit comment
          uses: actions/github-script@v7
          with:
            script: |
              const status = "${{ needs.deploy.result }}" === "success" ? "SUCCESS" : "FAILED";

              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body: `
                ## CI/CD Pipeline ${status}
                
                **Branch:** ${context.ref}
                **Author:** @${context.actor}

                **Code Quality** -> ${{ needs.checks.result }} |
                **Deployment** -> ${{ needs.deploy.result }} |
                `
              });