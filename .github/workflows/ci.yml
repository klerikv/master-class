name: CI/CD Pipeline

permissions:
  issues: write
  contents: read

on:
  push:
    branches: [ develop, uat, main ]
  pull_request:
    branches: [ develop, uat, main ]

jobs:
  # Тесты
  checks:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      # Тесты
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, ctype, fileinfo, json, mbstring, pdo, pdo_sqlite, tokenizer, xml
          coverage: xdebug
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Prepare environment
        run: |
          cp .env.ci .env
          php artisan key:generate
      
      - name: Run migrations
        run: php artisan migrate --force
      
      - name: Run tests with coverage
        run: php artisan test --coverage --min=50
      
      # Статический анализ
      - name: Run Larastan
        run: vendor/bin/phpstan analyse app --level=5 --error-format=github
      
      # Линтинг
      - name: Check code style
        run: vendor/bin/pint --test

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [checks]
    if: needs.checks.result == 'success'
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
  
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
        
      - name: Setup environment
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            cp .env.prod .env
            echo "Deploying to PRODUCTION with .env.prod"
          elif [ "${{ github.ref_name }}" = "uat" ]; then
            cp .env.uat .env
            echo "Deploying to UAT with .env.uat"
          else
            cp .env.dev .env
            echo "Deploying to DEVELOPMENT with .env.dev"
          fi
          php artisan key:generate
      
      - name: Simulate deployment
        run: echo "Deployment simulation completed for ${{ github.ref_name }}"

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [checks, deploy]
    if: always()
    
    steps:
      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.google.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "CI/CD Pipeline ${{ needs.deploy.result }} - ${{ github.ref_name }}"

          to: ${{ secrets.EMAIL_USERNAME }}
          from: "GitHub Actions <${{ secrets.EMAIL_USERNAME }}>"
        
          body: |          
            Status: ${{ needs.deploy.result }}
            Branch: ${{ github.ref_name }}
            
            Tests -> ${{ needs.tests.result }}
            Static Analysis -> ${{ needs.static-analysis.result }}
            Linting -> ${{ needs.linting.result }}
            Deployment Main -> ${{ needs.simulate-deploy-main.result }}
            Deployment Dev/Uat -> ${{ needs.simulate-deploy-dev-uat.result }}

